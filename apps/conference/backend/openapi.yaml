# OpenAPI spec for the conference backend — the single source of truth for the
# reshaped API (see .claude/PLAN.md). The frontend should generate its types
# from this file instead of hand-writing interfaces, which eliminates the
# number-vs-string id mismatch class of bug (FE.md 3.2).
#
# Conventions locked across every endpoint:
#   - camelCase JSON, string ids everywhere, ISO-8601 instants WITH a real
#     offset (never a naive/Z string).
#   - Collections are always arrays (never null); optional scalars are omitted
#     when empty (never "").
#   - Timestamps are anchored to the event's `timezone` (also in the payload).
#   - Three text fields carry sanitized rich-text HTML, not plain text:
#     Session.title, Session.description and Activity.description. The event
#     platform runs those through an allowlist on write (`internal/sanitize`.
#     RichText: p, br, strong, em, u, s, ul, ol, li, blockquote, a[href], and
#     span carrying a ql-* class or a font-weight style) and strips every other
#     text field it stores to plain text. This backend passes all of them
#     through untouched, so a client must render these three as HTML and can
#     treat the rest as text. The allowlist is the writer's Quill toolbar, so
#     the markup is bounded, but it is not sanitized again here — a client that
#     interpolates these into the DOM inherits the writer's allowlist as its
#     own trust boundary.
#
# Scope: the conference-data, attendee-search, connection and recommendation
# routes the series reshaped. The QR/coin, feedback, profile and AI-assistant
# routes registered in cmd/server/main.go are real but not described here yet —
# they were not part of the reshape, and documenting a response shape nobody
# has pinned down would be worse than the gap. An endpoint absent from this
# file is undocumented, not unimplemented.
openapi: 3.0.3
info:
  title: WSO2Con Conference Backend
  version: "1.0.0"
  description: >
    Conference data, attendee search, networking and recommendation endpoints.
    All routes except /health require the `x-jwt-assertion` header.
    Does not yet cover the QR/coin, feedback, profile and AI-assistant routes;
    see the scope note at the top of this file.
servers:
  - url: /
security:
  - jwtAssertion: []
tags:
  - name: sessions
  - name: events
  - name: speakers
  - name: attendees
  - name: connections
  - name: recommendations
  - name: shop

paths:
  /health:
    get:
      tags: [events]
      summary: Liveness/readiness probe (unauthenticated)
      security: []
      responses:
        "200": { description: "OK" }

  /sessions/current:
    get:
      tags: [sessions]
      summary: All sessions in the current conference, ordered by start time
      description: >
        Returns every session in the latest-start_date conference as Session
        objects (the same shape the agenda endpoints use), ordered by start
        time. Includes speaker-less sessions (breaks/registration). Carries
        ETag/Cache-Control validators.
      responses:
        "200":
          description: "OK"
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "304": { description: "Not Modified" }

  /sessions/{id}:
    get:
      tags: [sessions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "304": { description: "Not Modified" }
        "404": { description: "No such session" }

  /events:
    get:
      tags: [events]
      parameters:
        - name: previous
          in: query
          required: false
          schema: { type: boolean }
          description: "When `true`, returns only non-current events (history modal)."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "304": { description: "Not Modified" }

  /events/current:
    get:
      tags: [events]
      description: >
        The current conference (the one with the latest start_date), as a single
        object rather than an array. Clients read `id` from this and pin later
        requests to it.
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "304": { description: "Not Modified" }
        "404": { description: "No conference is configured" }

  /events/{eventId}/agendas:
    get:
      tags: [events]
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
          description: "A conference_config id, or the literal `current`."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventAgenda" }
        "304": { description: "Not Modified" }

  /event-agendas:
    get:
      tags: [events]
      description: "Query-param variant of the agenda resource."
      parameters:
        - { name: isCurrent, in: query, required: false, schema: { type: boolean } }
        - { name: eventId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventAgenda" }
        "400": { description: "Neither eventId nor isCurrent=true supplied" }

  /speakers:
    get:
      tags: [speakers]
      parameters:
        - name: eventId
          in: query
          required: false
          schema: { type: string }
          description: "Restrict to speakers with a session in this conference (and show only those sessions)."
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: "Case-insensitive substring match on speaker name (matched server-side after decryption)."
      responses:
        "200":
          description: "OK, ordered by name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpeakerSummary" }
        "304": { description: "Not Modified" }

  /speakers/{id}:
    get:
      tags: [speakers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Speaker" }
        "404": { description: "No such visible speaker" }

  /attendees/search:
    post:
      tags: [attendees]
      summary: Cursor-paginated attendee search (server-side filtering)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uuid: { type: string, description: "Optional single-attendee lookup by idp uuid." }
                query: { type: string, description: "Case-insensitive substring over name/company/title (decrypted server-side)." }
                cursor: { type: string, description: "Opaque nextCursor from a prior page." }
                limit: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendeeSearchResult" }
        "400": { description: "Invalid cursor or negative limit" }

  /users/me/connections:
    get:
      tags: [connections]
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserConnectionsInfo" }
    post:
      tags: [connections]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [userId, status]
              properties:
                userId: { type: string }
                status: { type: integer, enum: [-1, 0, 1], description: "-1 rejected, 0 pending, 1 accepted" }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionUserInfo" }

  /agenda/recommendations:
    get:
      tags: [recommendations]
      summary: Personalized "Picked for You" sessions, day-associated server-side
      description: >
        Proxies the external picked-for-you service and enriches each item with
        this backend's real `dayId` (conference_days uuid) so the client no
        longer intersects recommendation ids against the loaded agenda.
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PickedForYouSession" }

  /app-configs:
    get:
      tags: [events]
      summary: Key/value app configuration
      description: >
        Includes the single documented cache-invalidation signal `cacheVersion`
        (see .claude/PLAN.md Phase G). No write route exists in this service;
        values are seeded via SQL.
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    value: { type: string }

  /activities:
    get:
      tags: [events]
      summary: Venue amenities on the General page
      description: >
        Sourced from con_activities joined to con_activity_hours (upstream
        migration 029), scoped to the current conference. These are the things
        open at the venue while the agenda runs -- an O2 Bar, an FDE booth, a
        registration desk. They previously came from the shared sessions table
        where kind='activity' (upstream migration 021); 029 split that kind,
        which was carrying both these and the timed full-width bars (Networking
        Event, Speaker Reception, Conference Party) that belong in the printed
        agenda export. One kind could not answer "does the export publish this"
        both ways, so the amenities moved to their own tables and this endpoint
        followed them -- 'activity' now means only the timed bars, which are
        served as sessions, not here.
        One entry per *sitting*: an amenity open on two days is two entries
        sharing a name, and `id` is the opening-window's id so it stays unique
        across them. The array is flat and the client groups by name, unchanged
        from before 029. Ordered by con_activities.position, then name
        case-insensitively, then day and start of window -- position is the
        content team's arrangement of the page (upstream 029, edited in the admin
        Activities page) and defaults to 0, so data entered before that control
        existed falls through to the name. An activity-level key leads because
        the client's group-by preserves receive order, which keeps one amenity's
        sittings contiguous; ties between windows opening at the same minute
        break on the window id so the order is stable between requests.
        Times are wall-clock minutes from midnight upstream (the unit
        conference_days uses, not the session slot grid), anchored in
        conference_config.timezone.
        `location` is the conference's own venue (conference_config.venue_name /
        venue_address, upstream migration 018), so it is the same on every
        activity -- upstream models no per-activity location. It is omitted
        entirely while the venue name is unset.
        Returns an empty array, not an error, against a database below upstream
        029: migrations are applied by hand across the two repos with no
        ordering guarantee, so the tables' presence is probed and the read is
        skipped when they are absent.
        Carries ETag/Cache-Control validators.
      responses:
        "200":
          description: "OK"
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
        "304": { description: "Not Modified" }

  /wallets/balances/me:
    get:
      tags: [shop]
      summary: The caller's wallet address and O2C balance
      description: >
        Pure pass-through over two external services, no database involvement.
        The upstream balance arrives as a quoted decimal string and is emitted
        here as a number.
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                required: [walletAddress, balance]
                properties:
                  walletAddress: { type: string }
                  balance: { type: number }
        "404": { description: "The caller has no wallet" }

  /shops/items:
    get:
      tags: [shop]
      summary: The purchasable catalog for the current event
      description: >
        An envelope, not a bare array: the client needs to know whether the shop
        is open and which event the catalog belongs to, and neither is derivable
        from the item list. Only VISIBLE items are returned, so a hidden item is
        unbuyable rather than merely undisplayed. Items are still returned when
        the shop is closed, so past orders' lines can be resolved.
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopCatalog" }
        "304": { description: "Not Modified" }

  /shops/orders/me:
    get:
      tags: [shop]
      summary: The caller's own order history, newest first
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ShopOrder" }

  /shops/checkout:
    post:
      tags: [shop]
      summary: Create a PENDING order and reserve its stock
      description: >
        The order row, its lines, and one conditional stock decrement per line are
        a single transaction: a shortfall on any line rolls the whole basket back.
        `totalCost` and `eventId` are accepted and ignored -- the total is
        recomputed from live prices and the event is resolved server-side. A
        replayed `idempotencyKey` returns the original order without a second
        write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "200":
          description: "Order created (or an idempotent replay of one)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400":
          description: >
            Validation failure, or a stock/availability/per-user-limit rejection.
            Stock and limit rejections carry `itemId` and `availableQuantity` so
            the client can repair the offending cart line; an unavailable item
            carries `itemId` only, since it is not purchasable at any quantity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutStockError" }
        "409": { description: "The shop is closed" }

  /shops/checkout/confirm:
    post:
      tags: [shop]
      summary: Verify an order's on-chain payment and confirm it
      description: >
        The order is locked FOR UPDATE and re-read, and verification runs while
        that lock is held, so two concurrent confirms cannot both settle. The
        payment must be a `transfer` to the configured master wallet for exactly
        the order's stored total, and must have succeeded. Every verification
        failure returns the same opaque message; the reason is logged only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, transactionHash]
              properties:
                orderId: { type: string }
                transactionHash: { type: string }
      responses:
        "200":
          description: "Order confirmed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutResponse" }
        "400": { description: "Unknown order, reused transaction hash, or failed verification" }
        "403": { description: "The order belongs to another user" }
        "409": { description: "The order has already been processed" }

components:
  securitySchemes:
    jwtAssertion:
      type: apiKey
      in: header
      name: x-jwt-assertion
  schemas:
    Session:
      type: object
      required: [id, kind, title, durationSlots, colorToken]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "keynote | session | break | activity" }
        title: { type: string, description: "Sanitized rich-text HTML, not plain text -- the content team writes it in a Quill editor and the marketing agenda page renders the markup. See the rich-text convention at the top of this file." }
        description: { type: string, description: "Sanitized rich-text HTML, same allowlist and same caveat as title. Omitted when empty." }
        category:
          type: string
          description: >
            The session's topic label, resolved from track_topics via
            sessions.topic_id (upstream migration 023). Replaces the dropped
            sessions.category column; the key name is unchanged. Omitted against a
            database older than upstream 023.
        startTime: { type: string, format: date-time, description: "ISO-8601 with venue offset" }
        endTime: { type: string, format: date-time }
        dayId: { type: string, format: uuid }
        trackId: { type: string, format: uuid }
        colorToken:
          type: string
          enum: [red, yellow, green, blue, purple, dark-blue, main]
          description: >-
            Names which colour the session is, without saying what that colour
            looks like — the client owns the seven values and can define a
            different one per light/dark appearance. This is the only colour
            field the API publishes; the trackColor/roomColor hexes it replaced
            were each one fixed value a theme could not reinterpret. Resolved
            server-side as the session's room colour, else its track colour,
            else "main" — the room owns the colour, the track is the fallback.
            Always present: a session with no colour on either lands on "main".
        trackGroup:
          type: string
          description: >-
            Label of the track section the session sits in, e.g. "Case Studies"
            or "Keynote Sessions" — the heading a run of sessions is grouped
            under (track_sections.label). Absent when the session belongs to no
            section.
        slotIndex: { type: integer }
        durationSlots: { type: integer }
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        articleUrl: { type: string }
        articleLabel: { type: string }
        videoUrl: { type: string }
        videoLabel: { type: string }
        speakers:
          type: array
          description: >-
            Present only on the single-session reads (GET /sessions/{id},
            GET /sessions/current). The agenda endpoints omit it: an agenda
            card draws no speaker, so a client that wants them opens the
            session.
          items: { $ref: "#/components/schemas/SessionSpeaker" }
    SessionSpeaker:
      type: object
      required: [id, name, isModerator]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        title:
          type: string
          description: >-
            Speaker's job title (speakers.title), decrypted server-side. The
            /speakers endpoints publish this same column as "description" for
            legacy reasons. Absent when unset.
        company:
          type: string
          description: >-
            Speaker's company (speakers.company), decrypted server-side. Rarely
            populated upstream — the affiliation is usually only a suffix on
            title — so treat its absence as normal and fall back to title.
        photoUrl: { type: string }
        isModerator: { type: boolean, description: "From the owned presentation_overlay; replaces the FE moderators.json." }
    Event:
      type: object
      required: [id, name, isCurrent, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isCurrent: { type: boolean }
        timezone: { type: string, description: "IANA venue timezone (conference_config.timezone) the instants are expressed in." }
        venueName: { type: string, description: "From conference_config.venue_name; omitted when unset." }
        venueAddress: { type: string, description: "From conference_config.venue_address; omitted when unset." }
    EventAgenda:
      type: object
      required: [id, eventId, timezone, date, sessions]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        timezone: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/Session" }
    Speaker:
      type: object
      description: >-
        A speaker's full profile, returned by GET /speakers/{id} — everything
        the speaker detail screen renders, in one document.
      required: [id, name, bio, photoUrl, sessions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        bio: { type: string }
        photoUrl: { type: string }
        sessions:
          type: array
          description: >-
            The speaker's sessions in the current conference, resolved
            server-side. Past conferences are excluded.
          items: { $ref: "#/components/schemas/SpeakerSession" }
    SpeakerSummary:
      type: object
      description: >-
        One row of the speaker directory, returned by GET /speakers. Carries no
        sessions — the list never draws them; fetch GET /speakers/{id} for those.
      required: [id, name, bio, photoUrl]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        bio: { type: string }
        photoUrl: { type: string }
    SpeakerSession:
      type: object
      required: [id, title, colorToken]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        roomName: { type: string, description: "Absent when the session has no room." }
        colorToken:
          type: string
          enum: [red, yellow, green, blue, purple, dark-blue, main]
          description: >-
            Mirrors Session.colorToken exactly — the name of the session's
            colour, resolved by the same room → track → "main" chain, so a
            session shows the same colour on the speaker screen as on the
            agenda. Always present.
    AttendeeSearchResult:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Attendee" }
        page:
          type: object
          properties:
            nextCursor: { type: string, description: "Empty when this is the last page." }
    Attendee:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        company: { type: string }
        title: { type: string }
        country: { type: string }
        isPartner: { type: boolean }
        profileUrl: { type: string }
        qrUri: { type: string }
    UserConnectionsInfo:
      type: object
      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/ConnectionUserInfo" } }
        requestsSent: { type: array, items: { $ref: "#/components/schemas/ConnectionUserInfo" } }
        requestsReceived: { type: array, items: { $ref: "#/components/schemas/ConnectionUserInfo" } }
    ConnectionUserInfo:
      type: object
      required: [userId, name, email, status]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, accepted, rejected] }
        profileUrl: { type: string }
        title: { type: string }
        company: { type: string }
        country: { type: string }
    PickedForYouSession:
      type: object
      description: "External recommendation, day-associated with `dayId` server-side."
      properties:
        id: { type: string }
        title: { type: string }
        personalizedDescription: { type: string }
        dayId: { type: string, format: uuid, description: "This backend's conference_days id; empty if the session id didn't resolve." }
    Activity:
      type: object
      required: [id, name, startTime, endTime]
      properties:
        id: { type: string, format: uuid, description: "The con_activity_hours row's id, so sittings that share a name stay distinct." }
        name: { type: string, description: "con_activities.name; the client groups occurrences by it." }
        description:
          type: string
          description: >
            con_activities.description. Omitted when the activity has nothing to
            say beyond its name and time.
            Sanitized rich-text HTML on the same allowlist as Session.title (see
            the convention at the top of this file): upstream sanitizes it as
            rich text for parity with a session's description, since these
            amenities were sessions of kind='activity' before migration 029 split
            them out. In practice every value is plain text today, because the
            admin Activities page edits it in a plain text field rather than the
            Quill editor sessions use -- but that is a property of the current
            admin UI, not of the API, and a client that assumes plain text will
            break the day upstream swaps the control.
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        location:
          type: object
          description: >
            The conference's venue, from conference_config.venue_name /
            venue_address (upstream migration 018) — the same for every activity,
            since con_activities models no location of its own: an amenity's
            place is "at the venue", and the tables record what is open when, not
            where. Omitted entirely when venue_name is unset (its default),
            rather than sent as an object with an empty name.
          required: [name]
          properties:
            name: { type: string, description: "From conference_config.venue_name; the location object is absent when this is unset." }
            address: { type: string, description: "From conference_config.venue_address; omitted when unset." }
            floorPlanUrl: { type: string, description: "Never sent — nothing upstream models a floor plan. Retained because the client optional-chains it." }
    ShopItem:
      type: object
      required: [id, name, description, price, imageUrl, availableStock, category, visibility]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: number, description: "In O2C, stored as DECIMAL(10,4)." }
        imageUrl: { type: string }
        availableStock: { type: integer }
        maxPerUser:
          type: integer
          description: >
            Omitted when the item has no per-attendee cap. Enforced server-side at
            checkout against the caller's non-FAILED, non-EXPIRED orders.
        category: { type: string }
        visibility: { type: string, enum: [VISIBLE, HIDDEN, DELETED] }
    ShopCatalog:
      type: object
      required: [items, isShopOpen, activeEventId]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ShopItem" } }
        isShopOpen:
          type: boolean
          description: "False once conference_config.shop_closing_time has passed. A NULL closing time never closes."
        activeEventId: { type: string, format: uuid }
    ShopOrderLine:
      type: object
      description: >
        Item identity and unit price are each emitted under two names because the
        client reads `itemId || id` and `priceAtPurchase || price`. Both price
        fields carry the unit_price frozen at checkout, never the current price.
      required: [itemId, id, name, quantity, price, priceAtPurchase]
      properties:
        itemId: { type: string }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        category: { type: string }
        quantity: { type: integer }
        price: { type: number }
        priceAtPurchase: { type: number }
    ShopOrder:
      type: object
      required: [orderId, status, items, total, date]
      properties:
        orderId: { type: string, description: "\"ORD-\" + a UUIDv4, generated server-side." }
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, CONFIRMED, FULFILLED, EXPIRED, FAILED] }
        items: { type: array, items: { $ref: "#/components/schemas/ShopOrderLine" } }
        total: { type: number }
        date: { type: string, format: date-time }
        txHash: { type: string }
        shippingRecipientName: { type: string }
        shippingEmail: { type: string }
        shippingAddressLine1: { type: string }
        shippingAddressLine2: { type: string }
        shippingCity: { type: string }
        shippingState: { type: string }
        shippingPostalCode: { type: string }
        shippingCountry: { type: string }
    CheckoutRequest:
      type: object
      required: [items, shippingRecipientName, shippingEmail, shippingAddressLine1, shippingCity, shippingCountry]
      properties:
        idempotencyKey:
          type: string
          description: "Replaying one returns the original order rather than creating a second."
        eventId: { type: string, description: "Accepted and ignored; the event is resolved server-side." }
        totalCost: { type: number, description: "Accepted and ignored; the total is recomputed from live prices." }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, quantity]
            properties:
              id: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 1000 }
        shippingRecipientName: { type: string, maxLength: 255 }
        shippingEmail: { type: string, maxLength: 255 }
        shippingAddressLine1: { type: string, maxLength: 255 }
        shippingAddressLine2: { type: string, maxLength: 255 }
        shippingCity: { type: string, maxLength: 255 }
        shippingState: { type: string, maxLength: 255 }
        shippingPostalCode: { type: string, maxLength: 255 }
        shippingCountry: { type: string, maxLength: 255 }
    CheckoutResponse:
      type: object
      required: [orderId, transactionHash]
      properties:
        orderId: { type: string }
        transactionHash:
          type: string
          nullable: true
          description: "An explicit null from checkout; populated by confirm."
    CheckoutStockError:
      type: object
      required: [message]
      properties:
        message: { type: string }
        itemId: { type: string, description: "The offending cart line, when one item is at fault." }
        availableQuantity:
          type: integer
          description: >
            How many the caller may still buy -- remaining stock, or remaining
            per-user allowance. Absent when the item is not purchasable at all, so
            the client does not mistake it for a sold-out line.
